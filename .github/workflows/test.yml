name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick a simulator
        # Prefer the one the README names; fall back to any available iPhone.
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"].startswith("iPhone")]
          pick = next((d for d in devs if d["name"] == "iPhone 17 Pro"), devs[0])
          print(pick["udid"]); print(pick["name"], file=sys.stderr)')
          echo "SIM_ID=$id" >> "$GITHUB_ENV"

      - name: Test
        run: |
          xcodebuild -version
          xcodebuild test -scheme HRV \
            -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO
